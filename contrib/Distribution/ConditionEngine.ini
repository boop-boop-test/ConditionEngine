; ConditionEngine settings - Data/SKSE/Plugins/ConditionEngine.ini

[Watcher]
; Full re-check of every watch, for state with no change signal
; (actor values, globals, script properties, Game(...) functions). Per-watch overrides exist.
fPollIntervalSeconds = 10
; Cheap change detection: cell/location, game time, weather and actor state flags.
; Only watches depending on what changed are re-evaluated.
fDetectIntervalSeconds = 1

[Temperature]
; Global variable holding the current temperature for Temperature(...) conditions,
; as an editor ID or form string ("0x123|MyMod.esp"). Leave empty for a fixed 20.
; temperature = global * fScale + fOffset
sGlobal =
fScale = 1.0
fOffset = 0.0

[Console]
; The in-game console command "ce" (ConditionEngine) takes over this unused vanilla
; command. Type "ce help" in the console. Leave empty to not add the command.
sReplaceCommand = TestCode

[Dials]
; How often dial rules run, in milliseconds (50 to 2000)
iTickMs = 200
; The longest game-time gap a game-clock rule catches up on (sleeping, waiting, an NPC coming back)
fMaxCatchUpHours = 48
; How often each actor's "track" condition is checked again, in seconds
fTrackSeconds = 2
; Log every notified dial change
bVerbose = false

[Editor]
; The key that opens the editor: a name (F10, Insert, Num5) or a DirectInput scan code (0x44); 0 = none.
; Also "ce ui" in the console. A key picked in the editor itself wins over this one. With InputManager
; installed, the key is an InputManager action ("ConditionEngine_OpenEditor") you can rebind there,
; gamepad included; this key is only its first binding.
iHotkey = F10
bPauseGame = true
; VR: a controller button that opens the editor (0 = none). 1 = B/Y, 2 = grip, 7 = A/X, 32 = stick click,
; 33 = trigger, 35 = touchpad; iVRModifier is a second button held with it.
iVRButton = 0
iVRModifier = 0

[SkyrimNet]
; get_dials() and condition_engine() decorators, SkyrimNet events, memories, world knowledge, AI actions
bEnable = true
; How fresh condition_engine() answers are, in seconds
fRefreshSeconds = 1.5
