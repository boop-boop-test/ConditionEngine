; ConditionEngine settings - Data/SKSE/Plugins/ConditionEngine.ini

[Watcher]
; Full re-check of every watch, for state with no change signal
; (actor values, globals, script properties, Game(...) functions). Per-watch overrides exist.
fPollIntervalSeconds = 10
; Cheap change detection: cell/location, game time, weather and actor state flags.
; Only watches depending on what changed are re-evaluated.
fDetectIntervalSeconds = 1

[Temperature]
; Global variable holding the current temperature for Temperature(...) conditions,
; as an editor ID or form string ("0x123|MyMod.esp"). Leave empty for a fixed 20.
; temperature = global * fScale + fOffset
sGlobal =
fScale = 1.0
fOffset = 0.0

[Console]
; The in-game console command "ce" (ConditionEngine) takes over this unused vanilla
; command. Type "ce help" in the console. Leave empty to not add the command.
sReplaceCommand = TestCode
